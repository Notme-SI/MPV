# Настройки интерфейса и выбора языка, 12.10.2026
osc=no
# Use the custom interface instead of the built-in mpv OSD bar.
osd-bar=no
title-bar=no
alang=ru,rus,en,eng
slang=ru,rus
sid=auto

# Keep the window size independent from video resolution and cropping.
auto-window-resize=no
keepaspect-window=no
keepaspect=yes
geometry=1200x675
border=no
window-corners=donotround
panscan=0

# Disable the web-video extractor; direct media streams still work.
ytdl=no
